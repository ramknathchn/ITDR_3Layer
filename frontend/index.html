<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITDR Shield - Identity Threat Detection & Response Platform</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Cytoscape.js for Blast Radius Graph -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>

  <link rel="stylesheet" href="/static/src/styles/theme.css" />

  <!-- Restore saved theme before first paint (prevents flash-of-wrong-colour) -->
  <script>
    (function() {
      const saved = localStorage.getItem('itdr-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body style="margin: 0; padding: 0; overflow-x: hidden;">

  <!-- Root Lit Element Mount -->
  <itdr-app></itdr-app>

  <!-- ESM Module Entry Point -->
  <script type="module" src="/static/src/main.js?v=19"></script>

</body>
</html>
